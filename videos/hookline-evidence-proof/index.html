<!doctype html>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; background: #11100d; }

      .brand { position: absolute; top: 54px; left: 60px; font-size: 22px; letter-spacing: .09em; color: #c77855; font-weight: 700; }
      .series { position: absolute; top: 60px; right: 60px; color: #968f83; font-size: 15px; letter-spacing: .12em; }
      .headline { position: absolute; left: 60px; top: 118px; width: 510px; font-family: ui-serif, Georgia, serif; font-size: 82px; line-height: .96; letter-spacing: -.048em; font-weight: 500; }
      .headline span { display: inline-block; opacity: 0; }
      .deck { position: absolute; left: 64px; top: 312px; width: 420px; color: #bdb5a8; font-size: 21px; line-height: 1.5; }
      .desktop { position: absolute; left: 54px; top: 454px; width: 666px; height: 375px; border: 2px solid rgba(199,120,85,.64); overflow: hidden; background: #080806; box-shadow: 0 28px 70px rgba(0,0,0,.48); }
      .desktop img { width: 100%; height: 100%; object-fit: cover; }
      .phone { position: absolute; right: 54px; top: 148px; width: 430px; height: 822px; padding: 14px; border: 2px solid #c77855; background: #080806; box-shadow: 0 36px 100px rgba(0,0,0,.66); transform-origin: 100% 50%; }
      .phone::before { content: ''; position: absolute; left: 50%; top: 7px; width: 82px; height: 5px; margin-left: -41px; border-radius: 9px; background: #968f83; opacity: .55; z-index: 2; }
      .phone img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
      .readouts { position: absolute; left: 62px; top: 704px; display: grid; grid-template-columns: 1fr; gap: 12px; width: 520px; }
      .readout { display: flex; align-items: baseline; gap: 14px; opacity: 0; }
      .readout strong { color: #c77855; font-size: 21px; letter-spacing: .06em; min-width: 94px; }
      .readout span { color: #eee8dd; font-family: ui-serif, Georgia, serif; font-size: 31px; letter-spacing: -.025em; }
      .hairline { position: absolute; left: 60px; top: 410px; width: 470px; height: 2px; background: #c77855; transform-origin: 0 50%; }
