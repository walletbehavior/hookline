<!doctype html>
<html lang="en">

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; background: #11100d; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: #eee8dd; background: #11100d; font-family: "Space Mono", monospace; }
      .clip { position: absolute; inset: 0; width: 100%; height: 100%; }
      .grid { position: absolute; inset: 0; opacity: .28; background-image: linear-gradient(rgba(199,120,85,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(199,120,85,.1) 1px, transparent 1px); background-size: 54px 54px; mask-image: radial-gradient(circle at 60% 56%, #000 0 24%, transparent 72%); }
      .glow { position: absolute; width: 720px; height: 720px; right: -140px; top: 210px; border-radius: 50%; background: radial-gradient(circle, rgba(199,120,85,.19), rgba(199,120,85,0) 68%); }
      .brand { position: absolute; top: 52px; left: 62px; font-size: 22px; letter-spacing: .09em; color: #c77855; font-weight: 700; }

      .headline { position: absolute; top: 104px; left: 62px; right: 62px; font-family: ui-serif, Georgia, serif; font-size: 78px; line-height: .98; letter-spacing: -.045em; }
      .headline span { display: inline-block; opacity: 0; }
      .subhead { position: absolute; top: 202px; left: 66px; max-width: 790px; color: #bdb5a8; font-size: 21px; line-height: 1.45; }
      .rule { position: absolute; top: 252px; left: 62px; width: 956px; height: 2px; background: #c77855; transform-origin: 0 50%; }
      .surface { position: absolute; left: 62px; top: 288px; width: 956px; height: 538px; overflow: hidden; border: 2px solid rgba(199,120,85,.72); background: #080806; box-shadow: 0 34px 90px rgba(0,0,0,.55); transform-origin: 50% 50%; }
      .surface img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #runtime-selected { opacity: 0; }
      .registration { position: absolute; width: 19px; height: 19px; border-color: #c77855; border-style: solid; opacity: .8; }
      .r1 { left: 46px; top: 272px; border-width: 2px 0 0 2px; }
      .r2 { right: 46px; top: 272px; border-width: 2px 2px 0 0; }
      .r3 { left: 46px; top: 810px; border-width: 0 0 2px 2px; }
      .r4 { right: 46px; top: 810px; border-width: 0 2px 2px 0; }
      .cursor { position: absolute; left: 0; top: 0; z-index: 9; width: 34px; height: 42px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.55)); transform-origin: 6px 5px; }
      .cursor svg { display: block; width: 100%; height: 100%; }
      .ripple { position: absolute; z-index: 8; left: 558px; top: 610px; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; border: 3px solid #c77855; opacity: 0; transform: scale(0); pointer-events: none; }
      .fact { position: absolute; left: 64px; top: 866px; display: flex; align-items: center; gap: 18px; opacity: 0; }
      .fact strong { font-family: ui-serif, Georgia, serif; font-size: 46px; font-weight: 500; letter-spacing: -.035em; }
      .fact span { border: 1px solid rgba(199,120,85,.7); padding: 10px 15px; color: #d9a486; font-size: 17px; letter-spacing: .08em; }
      .foot { position: absolute; left: 66px; right: 66px; bottom: 56px; display: flex; justify-content: space-between; color: #968f83; font-size: 14px; letter-spacing: .08em; }
      .foot em { color: #eee8dd; font-style: normal; }
